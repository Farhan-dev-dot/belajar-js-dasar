<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SWITCH STATEMENT</title>
  </head>
  <body>
    <script>
      const nilai = "E";
      switch (nilai) {
        case "A":
          document.writeln(`Nilai A`);
          break;
        case "B":
          document.writeln(`Nilai B`);
          break;
        case "C":
          document.writeln(`Nilai C`);
          break;
        case "D":
          document.writeln(`Nilai D`);
          break;
        case "E":
          document.writeln(`Nilai E`);
          break;
        default:
          document.writeln(`ISTIGFAR BANG`);
      }
    </script>
  </body>
</html>
