<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>scope</title>
  </head>
  <body>
    <script>
      // global scope
      let counter = 0;
      // global scope
      function hitMe() {
        // Local scope function hitMe
        counter++; // we can access
      }

      function other() {
        // Local scope function other
      }

      hitMe();
      hitMe();

      console.info(counter);

      function first() {
        let firstVariable = "First";
      }
      function second() {
        let secondVariable = "Second";
      }

      first();
      second();

      console.info(firstVariable); // can not access Local scope
      console.info(secondVariable); // can not access local scope

      //nested function
      function firstNested() {
        let firstVariable = "First";

        function secondNested() {
          console.info(firstVariable); // can access Local scope first function
        }
      }

      secondNested();

      firstNested();
    </script>
  </body>
</html>
