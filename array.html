  <body>
    <script>
      let arrayKosong = [];

      // memasukan nilai ke array kosong
      arrayKosong.push("muhamad");

      let arrayNama = ["arzeta", "alena", "naycary"];

      console.table(arrayNama);
      console.table(arrayKosong);

      arrayKosong[0] = 0;

      delete arrayKosong[5];
      console.table(arrayKosong);

      arrayKosong.push("di tambah lagi");
      arrayKosong.push(["bola", "badmintond", "futsal"]);

      console.table(arrayKosong);
    </script>
