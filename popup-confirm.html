<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Popup Alert</title>
  </head>
  <body>
    <script>
      const masuk = confirm("anda yakin mau masuk ?");
      if (masuk) {
        const nama = prompt("sebutkan nama anda");
        alert(`Hello : ${nama}`);
      } else {
        alert(`no no`);
      }
    </script>
  </body>
</html>
